# Runs a ConcoLLMic benchmark exactly as the paper does, but against a local
# OpenAI-compatible model server (vLLM) instead of the Anthropic API.
#
#   cd experiments/local
#   ACE_MODEL=openai/Qwen/Qwen3.5-9B TIMEOUT=48h \
#     docker compose -f docker-compose.local.yml up bc-concolic
#
# Resource limits are copied from the artifact's docker-compose.yml so coverage
# numbers stay comparable to the published run. Each benchmark uses its own
# run_local.<name>.sh, generated by ./make_run_local.py.

name: concollmic-local

x-common-resources: &common-resources
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 8G
      reservations:
        cpus: "1"
        memory: 4G
  ulimits:
    core: 0

x-local-model: &local-model
  # A model registered in app/model/register.py, e.g. openai/Qwen/Qwen3.5-9B
  ACE_MODEL: "${ACE_MODEL:?set ACE_MODEL to a registered model name}"
  LOCAL_MODEL_API_BASE: "${LOCAL_MODEL_API_BASE:-http://host.docker.internal:8000/v1}"
  LOCAL_MODEL_API_KEY: "${LOCAL_MODEL_API_KEY:-EMPTY}"
  # Keep root-owned .pyc files out of the bind-mounted working tree.
  PYTHONDONTWRITEBYTECODE: "1"

services:
  # Base image: ubuntu + toolchain + ConcoLLMic's python deps.
  concolic:
    build:
      context: ../benchmarks/c_c++_programs
      dockerfile: concolic-common.Dockerfile
    image: concolic:latest

  confetti-concolic:
    <<: *common-resources
    build:
      context: ../benchmarks/c_c++_programs/confetti
      dockerfile: concolic.Dockerfile
    image: confetti-concolic:latest
    depends_on:
      - concolic
    environment: *local-model
    extra_hosts:
      # Lets the container reach vLLM listening on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - ../benchmarks/c_c++_programs/confetti/results:/shared/:rw
      # The local working tree replaces the image's GitHub clone.
      - ../../:/concolic-agent:rw
      - ./run_local.confetti.sh:/run_local.sh:ro
    command: ["/bin/bash", "/run_local.sh", "concolic", "${TIMEOUT:-48h}"]

  bc-concolic:
    <<: *common-resources
    build:
      context: ../benchmarks/c_c++_programs/bc
      dockerfile: concolic.Dockerfile
    image: bc-concolic:latest
    depends_on:
      - concolic
    environment: *local-model
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../benchmarks/c_c++_programs/bc/results:/shared/:rw
      - ../../:/concolic-agent:rw
      - ./run_local.bc.sh:/run_local.sh:ro
    command: ["/bin/bash", "/run_local.sh", "concolic", "${TIMEOUT:-48h}"]
